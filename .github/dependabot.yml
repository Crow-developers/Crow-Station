# Weekly dependency updates, grouped to keep the PR count low. All PRs target develop.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*", "Npgsql*"]
      testing:
        patterns: ["xunit*", "AwesomeAssertions", "NSubstitute", "NetArchTest*", "Testcontainers*", "Microsoft.Testing.*"]
      other:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend/web
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/backend", "/frontend/web"]
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build

  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
