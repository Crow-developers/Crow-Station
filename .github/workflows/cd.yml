# Continuous delivery: build, sign and publish images for every long-lived branch and release tag.
# Deployment is wired but disabled until servers exist: set the repository variable DEPLOY_ENABLED=true
# and create the GitHub environments development, staging and production (with required reviewers on production).
name: CD

on:
  push:
    branches: [develop, staging, main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Publish · ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend
          - image: web
            context: frontend/web
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name (registries require lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crow-station-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      # The image tag can be a branch name, but .NET needs a SemVer version: tags v1.2.3 -> 1.2.3,
      # branches -> 0.0.0-<branch>.<run number>.
      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0-${REF_NAME//[^0-9A-Za-z-]/-}.${RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=crow-station-${{ matrix.image }}
            org.opencontainers.image.vendor=Crow Developers

      - name: Build and push (with SBOM and provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### crow-station-${{ matrix.image }}"
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy · ${{ needs.target.outputs.environment }}
    needs: [images, target]
    if: vars.DEPLOY_ENABLED == 'true' && needs.target.outputs.environment != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Approvals (for production) and deployment secrets live in the GitHub environment, not in this file.
    environment:
      name: ${{ needs.target.outputs.environment }}
    steps:
      - name: Deploy
        env:
          ENVIRONMENT: ${{ needs.target.outputs.environment }}
          VERSION: ${{ needs.images.outputs.version }}
        run: |
          echo "::notice::No hosting target is configured yet for $ENVIRONMENT (version $VERSION)."
          echo "Replace this step with the real deployment, for example SSH + docker compose pull, or a Kubernetes rollout."

  # develop -> development, staging -> staging, version tag -> production. Pushes to main only publish images.
  target:
    name: Choose environment
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/develop) environment=development ;;
            refs/heads/staging) environment=staging ;;
            refs/tags/v*)       environment=production ;;
            *)                  environment="" ;;
          esac
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
